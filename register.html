<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mitra DPMPTSP - Registrasi</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#002147',
            secondary: '#1d4ed8', // A blue shade suitable for links/buttons if needed, matching the login style
            error: '#ef4444',
            surface: '#ffffff',
            'surface-muted': '#f8f9ff',
            text: '#1f2937',
            'text-muted': '#6b7280',
            border: '#e5e7eb',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          borderRadius: {
            DEFAULT: '0.25rem', // ROUND_FOUR implies 4px or small rounding
          }
        }
      }
    }
  </script>
<style data-purpose="custom-utilities">
    /* Geometric background pattern for the right side */
    .bg-geometric {
      background-image: url('data:image/svg+xml,%3Csvg width="100%25" height="100%25" xmlns="http://www.w3.org/2000/svg"%3E%3Cdefs%3E%3Cpattern id="a" patternUnits="userSpaceOnUse" width="100" height="100"%3E%3Crect width="50" height="50" fill="%23c4b5fd"/%3E%3Cpath d="M50 0 L100 50 L50 100 L0 50 Z" fill="%23a78bfa"/%3E%3Ccircle cx="75" cy="25" r="25" fill="%238b5cf6"/%3E%3Cpath d="M0 50 A50 50 0 0 1 50 100 L0 100 Z" fill="%237c3aed"/%3E%3Crect x="50" y="50" width="50" height="50" fill="%236d28d9"/%3E%3Cpath d="M100 50 A50 50 0 0 0 50 100 L100 100 Z" fill="%23c4b5fd"/%3E%3C/pattern%3E%3C/defs%3E%3Crect width="100%25" height="100%25" fill="url(%23a)"/%3E%3C/svg%3E');
      background-size: cover;
      background-position: center;
    }
    
    /* Ensure the split screen works well on very large screens */
    .split-layout {
      min-height: 100vh;
      display: flex;
    }
  </style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Phosphor Icons for UI elements -->
<script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="font-sans text-text bg-surface antialiased split-layout">
<!-- BEGIN: Left Section (Form Container) -->
<main class="w-full lg:w-1/2 flex flex-col justify-between p-8 sm:p-12 lg:p-16 xl:p-24 bg-surface" data-purpose="registration-form-section">
<!-- Top Area: Logo placeholder (Using text for Mitra DPMPTSP as requested by branding, or a placeholder if actual logo image isn't provided, but I'll use text for now to keep it clean) -->
<div class="mb-12">
<div class="flex items-center gap-3">
<!-- Placeholder for actual logo -->
<div class="w-10 h-10 bg-primary rounded flex items-center justify-center text-white font-bold text-xl">M</div>
<div>
<h1 class="text-xl font-bold text-primary leading-tight">Mitra</h1>
<h2 class="text-sm font-semibold text-text-muted leading-tight uppercase tracking-wide">DPMPTSP</h2>
</div>
</div>
</div>
<!-- Middle Area: Form Content -->
<div class="w-full max-w-md mx-auto xl:mx-0 flex-grow flex flex-col justify-center">
<div class="mb-8">
<h2 class="text-3xl font-bold text-text mb-2">Register Account</h2>
<p class="text-text-muted">Join the official procurement network.</p>
</div>
<form action="#" class="space-y-6" method="POST">
<!-- Business Identity Section -->
<fieldset class="space-y-4">
<legend class="text-sm font-semibold text-primary uppercase tracking-wider mb-2">Business Identity</legend>
<!-- Company Name -->
<div>
<label class="block text-sm font-medium text-text mb-1" for="companyName">Company Name <span class="text-error">*</span></label>
<input class="w-full px-4 py-2 border border-border rounded-DEFAULT focus:ring-2 focus:ring-primary focus:border-primary transition-colors" id="companyName" name="companyName" placeholder="Enter your company name" required="" type="text"/>
</div>
<!-- Business Type & NIB/NPWP Row -->
<div class="flex flex-col sm:flex-row gap-4">
<div class="w-full sm:w-1/2">
<label class="block text-sm font-medium text-text mb-1" for="businessType">Business Type <span class="text-error">*</span></label>
<select class="w-full px-4 py-2 border border-border rounded-DEFAULT focus:ring-2 focus:ring-primary focus:border-primary bg-white transition-colors" id="businessType" name="businessType" required="">
<option disabled="" selected="" value="">Select type</option>
<option value="pt">PT</option>
<option value="cv">CV</option>
<option value="perorangan">Perorangan</option>
<option value="lainnya">Lainnya</option>
</select>
</div>
<div class="w-full sm:w-1/2">
<label class="block text-sm font-medium text-text mb-1" for="nib">NIB / NPWP <span class="text-error">*</span></label>
<input class="w-full px-4 py-2 border border-border rounded-DEFAULT focus:ring-2 focus:ring-primary focus:border-primary transition-colors" id="nib" name="nib" placeholder="Enter NIB or NPWP" required="" type="text"/>
</div>
</div>
</fieldset>
<!-- Account Credentials Section -->
<fieldset class="space-y-4 pt-4 border-t border-border">
<legend class="text-sm font-semibold text-primary uppercase tracking-wider mb-2">Account Credentials</legend>
<!-- Email -->
<div>
<label class="block text-sm font-medium text-text mb-1" for="email">Email Address <span class="text-error">*</span></label>
<input class="w-full px-4 py-2 border border-border rounded-DEFAULT focus:ring-2 focus:ring-primary focus:border-primary transition-colors" id="email" name="email" placeholder="Enter work email" required="" type="email"/>
</div>
<!-- Password -->
<div>
<label class="block text-sm font-medium text-text mb-1" for="password">Password <span class="text-error">*</span></label>
<div class="relative">
<input class="w-full px-4 py-2 pr-10 border border-border rounded-DEFAULT focus:ring-2 focus:ring-primary focus:border-primary transition-colors" id="password" name="password" placeholder="Create a secure password" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-text-muted hover:text-text" data-purpose="toggle-password" type="button">
<i class="ph ph-eye-slash text-xl"></i>
</button>
</div>
<p class="text-xs text-text-muted mt-1">Must be at least 8 characters.</p>
</div>
</fieldset>
<!-- Terms and Privacy -->
<div class="flex items-start pt-2">
<div class="flex items-center h-5">
<input class="w-4 h-4 border-border rounded text-secondary focus:ring-secondary" id="terms" name="terms" required="" type="checkbox"/>
</div>
<div class="ml-2 text-sm">
<label class="font-medium text-text" for="terms">I agree to the <a class="text-secondary hover:underline" href="#">Terms &amp; Conditions</a> and <a class="text-secondary hover:underline" href="#">Privacy Policy</a>.</label>
</div>
</div>
<!-- Submit Button -->
<div>
<button class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-DEFAULT shadow-sm text-sm font-medium text-white bg-secondary hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-secondary transition-colors" type="submit">
            Register Entity
          </button>
</div>
<div class="text-center text-sm mt-4">
<span class="text-text-muted">Already have an account?</span>
<a class="font-medium text-secondary hover:underline" href="#">Log in here</a>
</div>
</form>
</div>
<!-- Bottom Area: Footer -->
<footer class="mt-12 text-center xl:text-left text-sm text-text-muted">
<p>© 2026 DPMPTSP SUMUT Develop by Codinglab.id</p>
</footer>
</main>
<!-- END: Left Section (Form Container) -->
<!-- BEGIN: Right Section (Pattern Background) -->
<!-- This section is hidden on smaller screens and takes up half the width on large screens -->
<aside class="hidden lg:block lg:w-1/2 bg-geometric relative overflow-hidden" data-purpose="hero-pattern-section">
<!-- Optional overlay to ensure the pattern isn't too overwhelming, though the reference image is quite bright -->
<div class="absolute inset-0 bg-white/10 mix-blend-overlay"></div>
</aside>
<!-- END: Right Section (Pattern Background) -->
<!-- Simple script for password toggle functionality -->
<script data-purpose="form-interactions">
    document.addEventListener('DOMContentLoaded', function() {
      const togglePasswordBtn = document.querySelector('[data-purpose="toggle-password"]');
      const passwordInput = document.getElementById('password');
      
      if(togglePasswordBtn && passwordInput) {
        togglePasswordBtn.addEventListener('click', function() {
          const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
          passwordInput.setAttribute('type', type);
          
          // Toggle icon (assuming Phosphor icons are loaded)
          const icon = this.querySelector('i');
          if (type === 'text') {
            icon.classList.remove('ph-eye-slash');
            icon.classList.add('ph-eye');
          } else {
            icon.classList.remove('ph-eye');
            icon.classList.add('ph-eye-slash');
          }
        });
      }
    });
  </script>
</body></html>
